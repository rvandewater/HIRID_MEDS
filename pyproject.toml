[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HIRID-MEDS"
dynamic = ["version"]
authors = [
    {name= "Robin van de Water", email="robin.vandewater@hpi.de"},
]
description = "An ETL pipeline to extract HIRID data into the MEDS format."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: the only runtime dependency is MEDS-Extract itself, which supplies both
# CLIs (`meds-extract-download`, `meds-extract-run`) and every extraction stage.
dependencies = ["MEDS-extract[download]>=0.7.0,<0.8"]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = ["pre-commit<4"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=HIRID output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
HIRID = "HIRID_MEDS.configs:messy.yaml"

[project.urls]
Homepage = "https://github.com/mmcdermott/ETL_MEDS_Template"
Issues = "https://github.com/mmcdermott/ETL_MEDS_Template/issues"

[tool.pytest.ini_options]
# `--doctest-modules` is scoped to the modules CI passes on the command line. The doctests in
# `utils.py` / `unpack.py` are the API-level tests for those helpers.
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
