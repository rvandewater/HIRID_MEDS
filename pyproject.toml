[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HIRID-MEDS"
# Bump with `uv version --bump patch|minor|major`, then tag the commit with the same version
# (see CONTRIBUTING.md); the publish workflow rejects a tag that does not match.
version = "0.1.0"
authors = [
    {name= "Robin van de Water", email="robin.vandewater@hpi.de"},
]
description = "An ETL pipeline to extract HIRID data into the MEDS format."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: MEDS-Extract supplies both CLIs (`meds-extract-download`, `meds-extract-run`)
# and every extraction stage. It is capped below the next minor: MEDS-Extract 0.x minors are
# breaking (MESSY syntax, runner CLI), so raise it deliberately when migrating. 0.8.1 is the floor:
# it runs the `etl.post_stages` the config declares, writes its dataset.json fields, and accepts the
# `_self` blocks that describe the literal codes.
# suMEDS 0.6.2 registers the `sumeds_enrich` stage the config declares as a post-stage, which
# enriches the code metadata with the rules registered below. A failed enrichment is a warning that
# keeps the ETL output (e.g. without internet), and `metadata/dataset.json` records whether the
# build was enriched. 0.6 writes the relationship names as code-to-name maps. It is capped below the
# next minor for the same reason (its rules format and CLI are 0.x).
dependencies = [
    "MEDS-extract[download]>=0.8.1,<0.9",
    "sumeds>=0.6.2,<0.7",
]

[project.optional-dependencies]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=HIRID output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
HIRID = "HIRID_MEDS.configs:messy.yaml"

# Registers the suMEDS rules under the same name, so the config's `sumeds_enrich: {rules: HIRID}`
# and `--rules HIRID` find them.
[project.entry-points."sumeds.rules"]
HIRID = "HIRID_MEDS:sumeds_rules.yaml"

[dependency-groups]
# Installed by a plain `uv sync`.
dev = ["pre-commit<4", "pytest"]

[project.urls]
Homepage = "https://github.com/rvandewater/HIRID_MEDS"
Issues = "https://github.com/rvandewater/HIRID_MEDS/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["HIRID_MEDS*"]

[tool.setuptools.package-data]
HIRID_MEDS = ["configs/*.yaml", "sumeds_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
