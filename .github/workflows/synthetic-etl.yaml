name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/conftest.py, which tests/test_etl.py checks value by value.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate synthetic data
        # MESSY_synth 0.1.0 loads the config with MEDS-Extract 0.8 and adopts join keys through
        # derived columns (mmcdermott/MESSY_synth#16), which the variable-reference join is keyed on
        # (a `Source Table` literal and a cast id). So it reads the shipped config, by its registered
        # name, in the project environment: with the locked MEDS-Extract the extraction runs on.
        run: |
          uv pip install --python .venv/bin/python "MESSY_synth==0.1.0"
          uv run --locked MESSY-synth HIRID -o raw_synthetic/ --explain

      - name: Extract synthetic data
        # The extraction runs the shipped config with this project's locked MEDS-Extract, as the
        # README documents it: the ETL, then the suMEDS enrichment stage, which records whether it
        # enriched in dataset.json (a failed enrichment would not fail the run).
        run: |
          uv run --locked meds-extract-run spec=HIRID output_dir=./HIRID_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "HIRID_meds_synth/metadata/$f"
          done
          jq -e '.sumeds_enrichment | has("enriched")' HIRID_meds_synth/metadata/dataset.json
