          "LOINC/6298-4" if /^(20000500|24000520|24000833|24000867)$/ in $ID::str else
          "LOINC/59826-8" if $ID::str == "20000600" else
          "LOINC/26464-8" if $ID::str == "20000700" else
          "LOINC/2708-6" if $ID::str == "20000800" else
          "LOINC/718-7" if /^(20000900|24000836)$/ in $ID::str else
          "LOINC/2019-8" if $ID::str == "20001200" else
