# MESSY config for the HiRID MEDS ETL (MEDS-Extract >= 0.7).
#
# This single file replaces what used to be spread across four places:
#   - `dataset.yaml`          -> the `sources:` block below
#   - `download.py`           -> the `sources:` block below
#   - `configs/ETL.yaml`      -> the `etl:` block below (the stage DAG is now canonical)
#   - `configs/event_configs.yaml` -> the event tables below, rewritten in dftly
#
# Run the whole ETL with:
#   meds-extract-run spec=HIRID output_dir=$OUTPUT_DIR
# (see README.md; `HIRID` is registered via the `MEDS_extract.pipelines` entry point).

sources:
  dataset_version: 1.1.1

  dataset:
    - type: physionet
      base_url: https://physionet.org/files/hirid/${sources.dataset_version}
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      # The HiRID release mixes archive and non-archive members under one SHA256SUMS, so the
      # unpack is declared source-level and applied per member. `auto` infers the format from
      # each filename and is a no-op on non-archives (README.md, *.csv.gz -- gz compression is
      # not a tar archive), so only the real .tar.gz members are expanded.
      unarchive: auto
      # The ETL only reads the reference table and the two raw_stage archives; staging
      # the rest of the release (notably the imputed/merged derived stages) would cost
      # tens of GB for data this ETL never opens.
      include:
        - reference_data.tar.gz
        - raw_stage/observation_tables_parquet.tar.gz
        - raw_stage/pharma_records_parquet.tar.gz

etl:
  dataset_name: hirid
  n_subjects_per_shard: 1000

_defaults:
  subject_id: $patientid

# ---------------------------------------------------------------------------
# `general_table` (from `reference_data.tar.gz`, which unpacks flat into the input root) is the
# patient/admission table. Everything the old `get_patient_link` + `save_last_event` did in polars
# is expressed here:
#
#   - the pseudo date of birth is the admission time minus the patient's age;
#   - death / discharge times come from the LAST observation recorded for the patient, which is
#     an aggregated join (`cols: {datetime: max}`) rather than a separate pre-MEDS pass.
#
# Join keys must have identical dtypes on both sides (polars panics otherwise). `patientid` is
# Int64 here (inferred from the CSV) but Int32 in the raw_stage parquet files, so the join uses a
# derived Int32 copy of the key.
#
# NOTE: `admissiontime` is parsed with an explicit format. The old code used polars' format
# inference (`str.strptime(pl.Datetime, strict=True)`), so if the real column is not
# "%Y-%m-%d %H:%M:%S" this needs adjusting. Unparsable values drop the row with a WARNING.
# ---------------------------------------------------------------------------

general_table:
  _table:
    join:
      raw_stage/observation_tables/parquet:
        left_on: _obs_patientid
        right_on: patientid
        cols:
          datetime: max
    cols:
      _obs_patientid: "$patientid::int32"
      _admitted: '$admissiontime::?"%Y-%m-%d %H:%M:%S"'
      _died: '$discharge_status != "alive"'
      date_of_birth: "$_admitted - $age::years"
      date_of_death: "$datetime if $_died"
  admission:
    code: HOSPITAL_ADMISSION
    time: $_admitted
  sex:
    code: 'f"SEX//{$sex ?? ''UNK''}"'
    time: null
  birth:
    code: MEDS_BIRTH
    time: $date_of_birth
  death:
    code: MEDS_DEATH
    time: $date_of_death
  discharge:
    code: HOSPITAL_DISCHARGE
    time: $datetime

# ---------------------------------------------------------------------------
# The two raw_stage tables are parquet with native timestamp columns, so `time` needs no cast.
#
# Variable names come from `hirid_variable_reference`, whose `ID` is only unique WITHIN a
# `Source Table`: a handful of ids are both an observation `variableid` and a `pharmaid`. Joining
# on `ID` alone would fan those rows out into one event per source table, so the join key also
# carries a literal `Source Table` value. `ID` is Int64 (CSV-inferred) while the raw ids are
# Int32, so the id key is cast to match.
#
# A few ids in the raw tables have no entry under their own `Source Table` (HiRID 1.1.1: 5
# observation and 2 pharma ids). Their code falls back to the raw id, so they stay distinct
# rather than all collapsing into one `UNK` code.
#
# The reference's `Variable Name` / `Unit` columns contain spaces, which dftly's `$name` shorthand
# cannot express; the explicit `{column: ...}` form can, so `_table.cols` aliases them once.
# See https://github.com/mmcdermott/dftly/issues/96.
# ---------------------------------------------------------------------------

raw_stage/pharma_records/parquet:
  _table:
    join:
      hirid_variable_reference:
        left_on: [_ref_table, _ref_id]
        right_on: [Source Table, ID]
        cols: [Variable Name]
    cols:
      _ref_table: "'Pharma'"
      _ref_id: "$pharmaid::int64"
      variable_name: { column: Variable Name }
  # The dose unit is recorded on every pharma row (`doseunit`), so it is taken from there rather
  # than from the reference table's `Unit`.
  medication:
    code: 'f"MEDICATION//{$variable_name ?? $pharmaid::str}"'
    time: $givenat
    numeric_value: $givendose
    text_value: $doseunit

raw_stage/observation_tables/parquet:
  _table:
    join:
      hirid_variable_reference:
        left_on: [_ref_table, _ref_id]
        right_on: [Source Table, ID]
        cols: [Variable Name, Unit]
    cols:
      _ref_table: "'Observation'"
      _ref_id: "$variableid::int64"
      variable_name: { column: Variable Name }
      unit: { column: Unit }
  # `stringvalue` is an empty string (not null) on almost every numeric row; only a real string
  # is kept as the text value.
  observation:
    code: 'f"OBSERVATION//{$variable_name ?? $variableid::str}//{$unit ?? ''UNK''}"'
    time: $datetime
    numeric_value: $value
    text_value: '$stringvalue if $stringvalue != ""'
